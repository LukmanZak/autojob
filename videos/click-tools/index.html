<!DOCTYPE html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <meta name="theme-color" content="#F4F1EA">
    <title>Click Tools — Automation. AI. Creativity.</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #F4F1EA;
        --ink: #1F252B;
        --graphite: #687078;
        --champagne: #B8895B;
        --stone: #E6E2D9;
        --font-display: Montserrat, sans-serif;
        --font-body: Montserrat, sans-serif;
        --font-label: "IBM Plex Mono", monospace;
        --brand: #B8895B;
        --fg: #1F252B;
        --muted: #687078;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--canvas);
      }

      body {
        color: var(--ink);
        font-family: var(--font-body);
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(ellipse at 88% 14%, rgba(184, 137, 91, 0.12), transparent 34%),
          radial-gradient(ellipse at 10% 88%, rgba(184, 137, 91, 0.08), transparent 32%),
          var(--canvas);
        color: var(--ink);
      }

      #stage::after {
        position: absolute;
        z-index: 20;
        inset: 0;
        background-image: radial-gradient(rgba(31, 37, 43, 0.1) 0.7px, transparent 0.7px);
        background-size: 19px 19px;
        content: "";
        opacity: 0.12;
        pointer-events: none;
      }

      #artboard {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .ambient-orbit,
      .ambient-orbit-inner,
      .ambient-glow {
        position: absolute;
        z-index: 0;
        pointer-events: none;
      }

      .ambient-orbit {
        top: -238px;
        right: -236px;
        width: 742px;
        height: 742px;
        border: 2px solid rgba(184, 137, 91, 0.2);
        border-radius: 50%;
      }

      .ambient-orbit-inner {
        top: -132px;
        right: -130px;
        width: 530px;
        height: 530px;
        border: 2px solid rgba(104, 112, 120, 0.12);
        border-radius: 50%;
      }

      .ambient-glow {
        bottom: -348px;
        left: -310px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(184, 137, 91, 0.12), transparent 68%);
        transform-origin: center;
      }

      .beat {
        position: absolute;
        inset: 0;
        display: grid;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
      }

      .scene-content {
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: 32px;
        padding: 142px 92px 142px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0;
        color: var(--graphite);
        font-family: var(--font-label);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.15;
        text-transform: uppercase;
      }

      .eyebrow-dot {
        display: block;
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
        border-radius: 50%;
        background: var(--champagne);
      }

      .scene-title {
        max-width: 880px;
        margin: 0;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 86px;
        font-weight: 700;
        letter-spacing: -0.055em;
        line-height: 1.04;
        text-wrap: balance;
      }

      .scene-art {
        position: relative;
        display: grid;
        min-height: 0;
        place-items: center;
        align-self: stretch;
      }

      #intro .scene-content {
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: 38px;
        padding-top: 246px;
        padding-bottom: 132px;
      }

      .intro-wordmark {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
      }

      .intro-copy {
        max-width: 790px;
        margin: 0;
        color: var(--graphite);
        font-family: var(--font-display);
        font-size: 58px;
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.1;
      }

      .intro-art {
        overflow: visible;
      }

      .intro-target {
        position: relative;
        display: grid;
        width: min(66vw, 650px);
        aspect-ratio: 1;
        place-items: center;
        border: 2px solid rgba(184, 137, 91, 0.3);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(244, 241, 234, 0.52), rgba(230, 226, 217, 0.1) 63%, transparent 64%);
        box-shadow: inset 0 0 0 26px rgba(244, 241, 234, 0.2);
      }

      .intro-target::before,
      .intro-target::after {
        position: absolute;
        border: 2px solid rgba(104, 112, 120, 0.2);
        border-radius: 50%;
        content: "";
      }

      .intro-target::before {
        inset: 64px;
      }

      .intro-target::after {
        inset: 128px;
        border-color: rgba(184, 137, 91, 0.32);
      }

      .target-core {
        display: grid;
        width: 118px;
        height: 118px;
        place-items: center;
        border: 3px solid var(--champagne);
        border-radius: 50%;
        background: var(--canvas);
        box-shadow: 0 18px 54px rgba(31, 37, 43, 0.1);
      }

      .target-core::before {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--champagne);
        content: "";
      }

      .intro-target-ring {
        position: absolute;
        inset: 0;
        border: 3px solid var(--champagne);
        border-radius: 50%;
        opacity: 0;
      }

      .hf-simulated-cursor {
        --hf-cursor-scale: 1.272727;
        --hf-cursor-fill: var(--ink);
        --hf-cursor-edge: var(--canvas);
        --hf-cursor-ring: var(--champagne);
        --hf-cursor-ring-size: 18px;
        --hf-cursor-ring-width: 1px;
        --hf-cursor-ring-display: block;
        z-index: 10;
      }

      .automation-map {
        display: grid;
        width: 100%;
        max-width: 896px;
        grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr) 44px minmax(0, 1fr);
        align-items: center;
        gap: 12px;
      }

      .workflow-node {
        display: flex;
        min-width: 0;
        min-height: 296px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        padding: 30px 24px;
        border: 2px solid rgba(104, 112, 120, 0.22);
        border-radius: 28px;
        background: rgba(244, 241, 234, 0.72);
        box-shadow: 0 22px 60px rgba(31, 37, 43, 0.06);
      }

      .workflow-symbol {
        display: grid;
        width: 84px;
        height: 84px;
        place-items: center;
        border: 2px solid rgba(184, 137, 91, 0.54);
        border-radius: 24px;
        background: rgba(184, 137, 91, 0.1);
      }

      .workflow-symbol svg {
        width: 48px;
        height: 48px;
        fill: none;
        stroke: var(--ink);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.5;
      }

      .workflow-label {
        color: var(--ink);
        font-family: var(--font-label);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }

      .workflow-lines {
        display: grid;
        width: 100%;
        gap: 12px;
      }

      .workflow-lines span {
        display: block;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(104, 112, 120, 0.2);
      }

      .workflow-lines span:last-child {
        width: 64%;
        background: rgba(184, 137, 91, 0.52);
      }

      .workflow-arrow {
        display: grid;
        width: 44px;
        height: 56px;
        place-items: center;
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 42px;
        font-weight: 600;
      }

      .assistant-panel {
        position: relative;
        display: flex;
        width: min(100%, 760px);
        min-height: 520px;
        flex-direction: column;
        justify-content: space-between;
        padding: 34px;
        border: 2px solid rgba(104, 112, 120, 0.22);
        border-radius: 36px;
        background: rgba(244, 241, 234, 0.78);
        box-shadow: 0 28px 78px rgba(31, 37, 43, 0.08);
      }

      .assistant-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 26px;
        border-bottom: 2px solid rgba(104, 112, 120, 0.16);
      }

      .assistant-status {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .assistant-status span:first-child {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--champagne);
      }

      .assistant-status span:last-child {
        width: 126px;
        height: 14px;
        border-radius: 999px;
        background: rgba(31, 37, 43, 0.7);
      }

      .assistant-menu {
        display: flex;
        gap: 10px;
      }

      .assistant-menu i {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(104, 112, 120, 0.42);
      }

      .conversation {
        display: grid;
        flex: 1;
        align-content: center;
        gap: 24px;
        padding: 32px 0;
      }

      .chat-bubble {
        display: flex;
        min-height: 90px;
        align-items: center;
        gap: 18px;
        padding: 20px 24px;
        border: 2px solid rgba(104, 112, 120, 0.16);
        border-radius: 24px;
        background: var(--canvas);
      }

      .chat-bubble.is-reply {
        margin-left: 70px;
        border-color: rgba(184, 137, 91, 0.3);
        background: rgba(184, 137, 91, 0.12);
      }

      .chat-avatar {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border-radius: 50%;
        background: var(--stone);
      }

      .chat-avatar::after {
        width: 16px;
        height: 16px;
        border: 2px solid var(--graphite);
        border-radius: 50%;
        content: "";
      }

      .chat-lines {
        display: grid;
        width: 100%;
        gap: 11px;
      }

      .chat-lines span {
        display: block;
        width: 100%;
        height: 11px;
        border-radius: 999px;
        background: rgba(31, 37, 43, 0.46);
      }

      .chat-lines span:last-child {
        width: 72%;
        background: rgba(104, 112, 120, 0.24);
      }

      .idea-chips {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .idea-chip {
        width: 30%;
        height: 58px;
        border: 2px solid rgba(104, 112, 120, 0.2);
        border-radius: 999px;
        background: rgba(230, 226, 217, 0.66);
      }

      .idea-chip:nth-child(2) {
        border-color: rgba(184, 137, 91, 0.44);
        background: rgba(184, 137, 91, 0.16);
      }

      .business-panel {
        position: relative;
        display: grid;
        width: min(100%, 780px);
        min-height: 548px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 18px;
        padding: 30px;
        border: 2px solid rgba(104, 112, 120, 0.22);
        border-radius: 34px;
        background: rgba(244, 241, 234, 0.68);
        box-shadow: 0 26px 72px rgba(31, 37, 43, 0.08);
      }

      .business-cell {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px;
        border: 2px solid rgba(104, 112, 120, 0.18);
        border-radius: 22px;
        background: rgba(244, 241, 234, 0.78);
      }

      .business-cell:nth-child(5) {
        border-color: rgba(184, 137, 91, 0.56);
        background: rgba(184, 137, 91, 0.14);
      }

      .business-node {
        display: block;
        width: 24px;
        height: 24px;
        border: 3px solid var(--champagne);
        border-radius: 50%;
      }

      .business-bars {
        display: grid;
        gap: 9px;
      }

      .business-bars span {
        display: block;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(104, 112, 120, 0.28);
      }

      .business-bars span:last-child {
        width: 58%;
        background: rgba(184, 137, 91, 0.58);
      }

      .visual-mosaic {
        display: grid;
        width: min(100%, 820px);
        grid-template-columns: 0.82fr 1.18fr 0.82fr;
        align-items: center;
        gap: 20px;
      }

      .image-card {
        position: relative;
        display: block;
        width: 100%;
        height: 410px;
        overflow: hidden;
        border: 2px solid rgba(104, 112, 120, 0.2);
        border-radius: 28px;
        background: var(--stone);
        box-shadow: 0 26px 72px rgba(31, 37, 43, 0.1);
      }

      .image-card::before,
      .image-card::after {
        position: absolute;
        display: block;
        content: "";
      }

      .image-card--one {
        background: radial-gradient(ellipse at 48% 44%, rgba(184, 137, 91, 0.5) 0 16%, transparent 17%), #E6E2D9;
      }

      .image-card--one::before {
        top: 16%;
        left: 18%;
        width: 64%;
        height: 68%;
        border: 3px solid rgba(31, 37, 43, 0.68);
        border-radius: 48% 48% 16% 16%;
      }

      .image-card--two {
        height: 498px;
        background:
          radial-gradient(circle at 53% 42%, rgba(244, 241, 234, 0.9) 0 18%, transparent 19%),
          radial-gradient(ellipse at 50% 50%, rgba(184, 137, 91, 0.48) 0 38%, transparent 39%),
          #E6E2D9;
      }

      .image-card--two::before {
        top: 18%;
        right: 14%;
        width: 36%;
        height: 72%;
        border: 3px solid rgba(31, 37, 43, 0.66);
        border-radius: 50%;
        transform: rotate(24deg);
      }

      .image-card--two::after {
        right: 12%;
        bottom: 20%;
        left: 12%;
        height: 3px;
        background: rgba(31, 37, 43, 0.6);
        transform: rotate(-18deg);
      }

      .image-card--three {
        background:
          radial-gradient(circle at 70% 30%, rgba(184, 137, 91, 0.46) 0 19%, transparent 20%),
          radial-gradient(ellipse at 30% 72%, rgba(244, 241, 234, 0.72) 0 30%, transparent 31%),
          #E6E2D9;
      }

      .image-card--three::before {
        top: 18%;
        right: 17%;
        bottom: 18%;
        left: 17%;
        border: 3px solid rgba(31, 37, 43, 0.62);
        border-radius: 46% 46% 38% 38%;
      }

      .hf-catalog-focus-blur-resolve {
        display: inline-flex;
        gap: 12px;
        color: var(--hf-word-color, var(--ink));
        font-family: var(--font-display);
        font-size: var(--hf-word-size, 96px);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .hf-catalog-focus-blur-resolve span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px)) scale(var(--hf-word-scale, 1));
        filter: blur(calc(var(--hf-word-blur, 0px) * var(--hf-word-blur-scale, 1)));
        will-change: transform, filter, opacity;
      }

      .hf-simulated-cursor {
        position: absolute;
        top: 0;
        left: 0;
        width: calc(44px * var(--hf-cursor-scale, 1));
        height: calc(44px * var(--hf-cursor-scale, 1));
        transform: translate3d(var(--hf-cursor-x, 0px), var(--hf-cursor-y, 0px), 0);
        pointer-events: none;
        filter: drop-shadow(0 8px 18px rgba(31, 37, 43, 0.24));
      }

      .hf-simulated-cursor svg {
        width: 100%;
        height: 100%;
      }

      .hf-simulated-cursor svg path {
        fill: var(--hf-cursor-fill, #F4F1EA);
        stroke: var(--hf-cursor-edge, #F4F1EA);
      }

      .hf-simulated-cursor-pulse {
        display: var(--hf-cursor-ring-display, block);
        position: absolute;
        top: calc((20px - var(--hf-cursor-ring-size, 22px) / 2) * var(--hf-cursor-scale, 1));
        left: calc((20px - var(--hf-cursor-ring-size, 22px) / 2) * var(--hf-cursor-scale, 1));
        width: calc(var(--hf-cursor-ring-size, 22px) * var(--hf-cursor-scale, 1));
        height: calc(var(--hf-cursor-ring-size, 22px) * var(--hf-cursor-scale, 1));
        border: calc(var(--hf-cursor-ring-width, 2px) * var(--hf-cursor-scale, 1)) solid var(--hf-cursor-ring, rgba(184, 137, 91, 0.85));
        border-radius: 999px;
        opacity: 0;
      }
    </style>
  </head>

        tl.fromTo(

          { opacity: 0, ...artFrom },
          { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.52, ease: artEase },
          start + 0.23,

        tl.to(selector, { opacity: 0, duration: 0.22, ease: "sine.in" }, end - 0.22);
