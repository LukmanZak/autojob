        - generic [ref=f88e193]:
          - paragraph [ref=f88e194]: "Here's the updated version with years of experience added:"
          - separator [ref=f88e195]
          - paragraph [ref=f88e196]:
            - strong [ref=f88e197]: Role Description
          - paragraph [ref=f88e198]:
            - text: We are seeking a motivated and detail-oriented
            - strong [ref=f88e199]: Middle AI Engineer
            - text: to join our engineering team at
            - strong [ref=f88e200]: PT Fata Organa Solusi
            - text: . In this role, you will focus on designing, building, and deploying AI-powered solutions, integrating large language models (LLMs) into production systems, and developing machine learning pipelines that deliver real business value. You will collaborate closely with product, data, and software engineering teams to translate business problems into AI solutions, fine-tune and evaluate models, and ensure the reliability and scalability of AI services in production. This is an excellent opportunity for a highly responsible individual with a passion for artificial intelligence, applied machine learning, and emerging LLM technologies who is eager to grow within a supportive, innovation-focused environment. Your technical skills and commitment to good teamwork will be essential in delivering robust and impactful AI solutions.
          - paragraph [ref=f88e201]:
            - strong [ref=f88e202]: "Responsibilities:"
          - list [ref=f88e203]:
            - listitem [ref=f88e204]:
              - paragraph [ref=f88e205]: You will design, implement, and maintain AI/ML pipelines covering data preparation, model training, evaluation, and deployment using frameworks such as PyTorch, TensorFlow, scikit-learn, or similar.
            - listitem [ref=f88e206]:
              - paragraph [ref=f88e207]: You will build and integrate LLM-based applications using APIs and frameworks such as OpenAI, Anthropic Claude, Azure OpenAI, LangChain, LlamaIndex, or similar, including prompt engineering, RAG (Retrieval-Augmented Generation), and agentic workflows.
            - listitem [ref=f88e208]:
              - paragraph [ref=f88e209]: You will develop and maintain vector databases and embedding pipelines (e.g., Pinecone, Weaviate, Qdrant, pgvector, FAISS) to support semantic search and retrieval use cases.
            - listitem [ref=f88e210]:
              - paragraph [ref=f88e211]: You will deploy AI models and services to production using containerization (Docker) and cloud platforms such as Azure, AWS, or Google Cloud Platform, ensuring scalability, latency, and cost efficiency.
            - listitem [ref=f88e212]:
              - paragraph [ref=f88e213]: You will implement evaluation frameworks, guardrails, and monitoring for AI systems to track model performance, hallucinations, drift, and safety in production.
            - listitem [ref=f88e214]:
              - paragraph [ref=f88e215]: You will collaborate with product and engineering teams to translate business requirements into AI solutions, define success metrics, and iterate based on feedback and data.
            - listitem [ref=f88e216]:
              - paragraph [ref=f88e217]: You will fine-tune, adapt, and optimize models (including small language models, embeddings, and classical ML models) when off-the-shelf solutions are insufficient.
            - listitem [ref=f88e218]:
              - paragraph [ref=f88e219]: You will manage version control workflows for code, prompts, datasets, and models, including reproducibility and experiment tracking using tools like Git, MLflow.
            - listitem [ref=f88e220]:
              - paragraph [ref=f88e221]: You will troubleshoot AI/ML system issues, applying strong problem-solving skills to diagnose problems across data, model, and infrastructure layers.
            - listitem [ref=f88e222]:
              - paragraph [ref=f88e223]: You will document model designs, prompt strategies, evaluation results, and operational runbooks to maintain knowledge across the team.
            - listitem [ref=f88e224]:
              - paragraph [ref=f88e225]: You will proactively engage in self-learning to keep up with the rapidly evolving AI landscape, and if necessary, be willing to unlearn and relearn methods to maintain industry best practices.
          - paragraph [ref=f88e226]:
            - strong [ref=f88e227]: "Requirements:"
          - list [ref=f88e228]:
            - listitem [ref=f88e229]:
              - paragraph [ref=f88e230]: Minimum 3 years of professional experience in AI/ML engineering, data science, or a closely related software engineering role, with at least 1 year working on AI/LLM-based applications in production.
            - listitem [ref=f88e231]:
              - paragraph [ref=f88e232]: Solid understanding of machine learning fundamentals (supervised/unsupervised learning, evaluation metrics, overfitting, regularization, etc.).
            - listitem [ref=f88e233]:
              - paragraph [ref=f88e234]: Hands-on experience building applications with LLMs through APIs (OpenAI, Anthropic, Azure OpenAI, or similar) and/or open-source models (Llama, Mistral, Qwen, or similar).
            - listitem [ref=f88e235]:
              - paragraph [ref=f88e236]: Strong proficiency in Python, including common libraries such as NumPy, pandas, and at least one ML framework (PyTorch, TensorFlow, or scikit-learn).
            - listitem [ref=f88e237]:
              - paragraph [ref=f88e238]: "Experience with at least one cloud platform: Azure, AWS, or Google Cloud Platform, including their AI/ML services."
            - listitem [ref=f88e239]:
              - paragraph [ref=f88e240]: Experience with containerization technologies, particularly Docker.
            - listitem [ref=f88e241]:
              - paragraph [ref=f88e242]: Practical experience with prompt engineering, RAG architectures, embeddings, and vector search.
            - listitem [ref=f88e243]:
              - paragraph [ref=f88e244]: Experience building and consuming RESTful APIs, with familiarity in frameworks such as FastAPI or Flask.
            - listitem [ref=f88e245]:
              - paragraph [ref=f88e246]: "Experience with any RDBMS systems: SQL Server, PostgreSQL, MySQL, or similar, with solid SQL proficiency."
            - listitem [ref=f88e247]:
              - paragraph [ref=f88e248]: Strong understanding of Git concepts (branching, PR, commit, merge, tagging).
            - listitem [ref=f88e249]:
              - paragraph [ref=f88e250]: Strong sense of responsibility, good teamwork, and communication skills.
            - listitem [ref=f88e251]:
              - paragraph [ref=f88e252]: Strong problem-analyzing and problem-solving skills, with good debugging ability across data, code, and model layers.
            - listitem [ref=f88e253]:
              - paragraph [ref=f88e254]: Willingness to self-learn new things, and if necessary, unlearn and relearn methods, especially given the fast pace of AI advancement.
            - listitem [ref=f88e255]:
              - paragraph [ref=f88e256]: Fluent in English, proven by an interview in English (equivalent to at least 525 TOEFL PBT or 5.5 IELTS or 55 TOEFL iBT).
          - paragraph [ref=f88e257]:
            - strong [ref=f88e258]: "Advantageous if:"
          - list [ref=f88e259]:
            - listitem [ref=f88e260]:
              - paragraph [ref=f88e261]: Have experience deploying AI/ML models to production at scale (model serving, batching, GPU optimization).
            - listitem [ref=f88e262]:
              - paragraph [ref=f88e263]: Experience with agentic frameworks and tool use (LangChain, LlamaIndex, LangGraph, AutoGen, or similar).
            - listitem [ref=f88e264]:
              - paragraph [ref=f88e265]: Experience fine-tuning models (LoRA/QLoRA, instruction tuning) or training custom embeddings.
            - listitem [ref=f88e266]:
              - paragraph [ref=f88e267]: Understanding of MLOps practices and tools (MLflow, Kubeflow, SageMaker, Vertex AI, Azure ML).
            - listitem [ref=f88e268]:
              - paragraph [ref=f88e269]: Experience with vector databases (Pinecone, Weaviate, Qdrant, pgvector, Milvus) at production scale.
            - listitem [ref=f88e270]:
              - paragraph [ref=f88e271]: Have experience implementing AI safety, evaluation, and observability practices (LangSmith, LangFuse, Arize, or similar).
            - listitem [ref=f88e272]:
              - paragraph [ref=f88e273]: Familiarity with multimodal models (vision, audio, OCR) and their integration into business workflows.
            - listitem [ref=f88e274]:
              - paragraph [ref=f88e275]: Understanding of data engineering concepts and pipeline tools (Airflow, Prefect, dbt).
            - listitem [ref=f88e276]:
              - paragraph [ref=f88e277]: Have N5 or higher Japanese Proficiency.
            - listitem [ref=f88e278]:
              - paragraph [ref=f88e279]: Experience contributing to or maintaining open-source AI/ML projects.
            - listitem [ref=f88e280]:
              - paragraph [ref=f88e281]: Able to write good and concise technical documentation and runbooks.
            - listitem [ref=f88e282]:
              - paragraph [ref=f88e283]: Have relevant certifications (Azure AI Engineer, AWS Machine Learning, Google Cloud ML Engineer, or similar).
          - paragraph [ref=f88e284]:
            - strong [ref=f88e285]: Benefits
          - list [ref=f88e286]:
            - listitem [ref=f88e287]:
              - paragraph [ref=f88e288]: Tax and BPJS + BPJSTK fully paid by company, including full BPJSTK Coverage (4 items)
            - listitem [ref=f88e289]:
              - paragraph [ref=f88e290]: Yearly bonus based on performance (up to 2x)
          - paragraph [ref=f88e291]:
            - strong [ref=f88e292]: About us
          - paragraph [ref=f88e293]: PT Fata Organa Solusi subsidiaries of CAC Holding Japan is a forward-thinking organization specializing in innovative business solutions. We are committed to leveraging the latest technologies in data science to drive decision-making and enhance our product offerings.
          - paragraph [ref=f88e294]:
            - strong [ref=f88e295]: What we offer
          - paragraph [ref=f88e296]: At PT Fata Organa Solusi, we are committed to fostering a dynamic and supportive work environment that enables our employees to thrive. We offer competitive salaries, opportunities for career advancement, and a range of benefits to support your well-being. Our team members enjoy a collaborative culture, flexible work arrangements, and access to continuous learning and development initiatives.
          - paragraph [ref=f88e297]: If you're ready to embark on an exciting journey and contribute to our thriving team, we encourage you to apply now!
